<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lala SGI Policy Calculator</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7fb,#11151b);--s:light-dark(#fff,#1a2028);--ss:light-dark(#f7f9fc,#202731);--t:light-dark(#172033,#f3f6fb);--m:light-dark(#697386,#aab4c3);--b:light-dark(#dce3ec,#313b49);--a:light-dark(#1f5eff,#6f96ff);--as:light-dark(#eaf0ff,#263657);--g:light-dark(#087443,#55c991)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}.shell{width:min(1120px,100%);margin:auto;padding:28px 18px}.brand{display:flex;gap:14px;align-items:center;margin-bottom:22px}.logo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--a);color:#fff;font-weight:800}.brand h1{margin:0;font-size:30px}.sub{margin:4px 0;color:var(--m);font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.tab,.card{background:var(--s);border:1px solid var(--b);border-radius:16px}.tab{padding:16px;text-align:left;color:var(--t);cursor:pointer}.tab.active{border-color:var(--a);background:var(--as)}.tt{font-weight:750}.td{color:var(--m);font-size:12px;margin-top:4px}.card{padding:20px}.title{font-size:17px;font-weight:750;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end}label{display:block;font-size:12px;font-weight:700;color:var(--m);margin-bottom:7px}input{width:100%;padding:12px;border:1px solid var(--b);border-radius:11px;background:var(--ss);color:var(--t);font-size:15px}.payouts{display:flex;gap:8px}.pb,.toggle{border:1px solid var(--b);background:var(--ss);color:var(--t);border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.pb.active{background:var(--a);color:#fff;border-color:var(--a)}.manual{position:relative}.manual span{position:absolute;right:12px;top:12px;color:var(--m);font-weight:700}.manual input{padding-right:30px}.results{margin-top:22px}.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.rhead h2{margin:0;font-size:16px}.status{color:var(--g);font-size:12px;font-weight:700}.table{overflow:auto;border:1px solid var(--b);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}th{background:var(--ss);color:var(--m);font-size:11px;text-transform:uppercase}td{font-size:14px;font-weight:650}th:first-child,td:first-child{text-align:left}tr:last-child td{border:0}.hidden{display:none}footer{text-align:center;color:var(--m);font-size:12px;padding:24px}footer a{color:var(--a);font-weight:700}@media(max-width:760px){.tabs,.grid{grid-template-columns:1fr}.shell{padding:20px 12px}.card{padding:16px}}
</style></head><body><main class="shell"><header class="brand"><div class="logo">LS</div><div><h1>SGI Policy Calculator</h1><p class="sub">Policy payout, net amount and margin calculation</p></div></header><nav class="tabs"><button class="tab active" id="tabTotal"><div class="tt">Payout Based on Total Premium</div><div class="td">Calculate payout from total premium including GST.</div></button><button class="tab" id="tabOd"><div class="tt">Payout Based on OD Only</div><div class="td">Calculate payout directly from OD Premium.</div></button></nav><section class="card"><div id="totalPanel"><div class="title">Policy Details</div><div class="grid"><div><label>Total Premium</label><input id="totalPremium" type="number" min="0" step=".01" placeholder="Enter total premium"></div><div><label>Payout %</label><div class="payouts"><button class="pb active" data-p="48">48%</button><button class="pb" data-p="50">50%</button><button class="pb" data-p="55">55%</button></div></div><div><label>Policy Sale Price</label><input id="totalSalePrice" type="number" min="0" step=".01" placeholder="Enter policy sale price"></div></div></div><div id="odPanel" class="hidden"><div class="title">Policy Details</div><div class="grid"><div><label>OD Premium</label><input id="odPremium" type="number" min="0" step=".01" placeholder="Enter OD premium"></div><div><label>Payout % (Manual)</label><div class="manual"><input id="manualPayout" type="number" min="0" step=".01" placeholder="Enter payout %"><span>%</span></div></div><div><label>Policy Sale Price</label><input id="odSalePrice" type="number" min="0" step=".01" placeholder="Enter policy sale price"></div></div></div><div class="results"><div class="rhead"><h2>Calculation Result</h2><div><button class="toggle" id="tdsToggle">Show TDS</button> <span class="status">Auto calculated</span></div></div><div class="table"><table><thead><tr><th>Net Premium</th><th>Payout Amt</th><th id="thTds" class="hidden">TDS</th><th>Net Payout</th><th>Net Policy Amt</th><th>Margin</th></tr></thead><tbody><tr><td id="net">₹0.00</td><td id="pay">₹0.00</td><td id="tds" class="hidden">₹0.00</td><td id="np">₹0.00</td><td id="npa">₹0.00</td><td id="margin">₹0.00</td></tr></tbody></table></div></div></section><footer>Developer Contact: <a href="mailto:lalasgipolicy@gmail.com">lalasgipolicy@gmail.com</a></footer></main><script>
(()=>{let mode='total',p=48,show=false,$=id=>document.getElementById(id),num=id=>Math.max(0,Number($(id).value)||0),money=x=>'₹'+Number(x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});function calc(){let n,pa,s;if(mode==='total'){let t=num('totalPremium');s=num('totalSalePrice');n=t/118*100;pa=n*p/100}else{let o=num('odPremium');s=num('odSalePrice');n=o;pa=o*num('manualPayout')/100}let t=pa*2/100,np=pa-t,npa=mode==='total'?num('totalPremium')-np:n-np,m=s-npa; $('net').textContent=money(n);$('pay').textContent=money(pa);$('tds').textContent=money(t);$('np').textContent=money(np);$('npa').textContent=money(npa);$('margin').textContent=money(m)}function set(m){mode=m;$('totalPanel').classList.toggle('hidden',m!=='total');$('odPanel').classList.toggle('hidden',m!=='od');$('tabTotal').classList.toggle('active',m==='total');$('tabOd').classList.toggle('active',m==='od');calc()}$('tabTotal').onclick=()=>set('total');$('tabOd').onclick=()=>set('od');$('tdsToggle').onclick=()=>{show=!show;$('thTds').classList.toggle('hidden',!show);$('tds').classList.toggle('hidden',!show);$('tdsToggle').textContent=show?'Hide TDS':'Show TDS'};document.querySelectorAll('.pb').forEach(b=>b.onclick=()=>{p=Number(b.dataset.p);document.querySelectorAll('.pb').forEach(x=>x.classList.remove('active'));b.classList.add('active');calc()});document.querySelectorAll('input').forEach(x=>x.oninput=calc);calc()})();
</script></body></html>
